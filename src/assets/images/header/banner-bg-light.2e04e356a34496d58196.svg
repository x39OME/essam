<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="900" viewBox="0 0 1920 900">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F4FF"/>
      <stop offset="45%" stop-color="#E8EEFF"/>
      <stop offset="100%" stop-color="#EEF0FF"/>
    </linearGradient>

    <!-- Left nebula -->
    <radialGradient id="nebula-left" cx="25%" cy="45%" r="35%">
      <stop offset="0%" stop-color="#AA367C" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#AA367C" stop-opacity="0"/>
    </radialGradient>

    <!-- Right nebula -->
    <radialGradient id="nebula-right" cx="82%" cy="70%" r="28%">
      <stop offset="0%" stop-color="#4A2FBD" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#4A2FBD" stop-opacity="0"/>
    </radialGradient>

    <!-- Top-center subtle glow -->
    <radialGradient id="nebula-top" cx="55%" cy="18%" r="20%">
      <stop offset="0%" stop-color="#6B4EFF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#6B4EFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Orb glow -->
    <radialGradient id="orb-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00CFFF" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#4A2FBD" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#4A2FBD" stop-opacity="0"/>
    </radialGradient>

    <!-- Orb inner -->
    <radialGradient id="orb-inner" cx="38%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#CCEEFF"/>
      <stop offset="50%" stop-color="#66BBFF"/>
      <stop offset="100%" stop-color="#3A5FCD"/>
    </radialGradient>

    <!-- Shooting star gradient -->
    <linearGradient id="streak1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#AA367C" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7B3FBE" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#4A2FBD" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="streak2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4A2FBD" stop-opacity="0"/>
      <stop offset="60%" stop-color="#AA367C" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#AA367C" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="streak3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7B3FBE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00CFFF" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#4A2FBD" stop-opacity="0"/>
    </linearGradient>

    <!-- Blur filter for glow -->
    <filter id="blur-orb">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="blur-sm">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="blur-xs">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>

  <!-- ─── Background ─── -->
  <rect width="1920" height="900" fill="url(#bg)"/>

  <!-- ─── Nebula blobs ─── -->
  <rect width="1920" height="900" fill="url(#nebula-left)"/>
  <rect width="1920" height="900" fill="url(#nebula-right)"/>
  <rect width="1920" height="900" fill="url(#nebula-top)"/>

  <!-- ─── Shooting stars (diagonal streaks) ─── -->
  <!-- Streak 1: top-left -->
  <line x1="80" y1="95" x2="320" y2="22" stroke="url(#streak1)" stroke-width="1.5" opacity="0.8"/>
  <line x1="82" y1="97" x2="322" y2="24" stroke="url(#streak3)" stroke-width="0.5" opacity="0.4" filter="url(#blur-xs)"/>

  <!-- Streak 2: upper-center -->
  <line x1="580" y1="55" x2="780" y2="118" stroke="url(#streak2)" stroke-width="1.3" opacity="0.7"/>
  <line x1="581" y1="57" x2="781" y2="120" stroke="url(#streak1)" stroke-width="0.4" opacity="0.35" filter="url(#blur-xs)"/>

  <!-- Streak 3: right area -->
  <line x1="1050" y1="285" x2="1160" y2="240" stroke="url(#streak3)" stroke-width="1.4" opacity="0.65"/>

  <!-- Streak 4: far-right top -->
  <line x1="1580" y1="32" x2="1920" y2="90" stroke="url(#streak1)" stroke-width="1.2" opacity="0.60"/>

  <!-- Streak 5: lower left -->
  <line x1="150" y1="680" x2="310" y2="720" stroke="url(#streak2)" stroke-width="1.1" opacity="0.55"/>

  <!-- Streak 6: center lower -->
  <line x1="530" y1="710" x2="780" y2="760" stroke="url(#streak3)" stroke-width="1.0" opacity="0.50"/>

  <!-- Streak 7: lower right -->
  <line x1="950" y1="760" x2="1150" y2="820" stroke="url(#streak1)" stroke-width="1.2" opacity="0.55"/>

  <!-- Streak 8: far right lower -->
  <line x1="1620" y1="640" x2="1920" y2="700" stroke="url(#streak2)" stroke-width="1.3" opacity="0.60"/>

  <!-- ─── Glowing orb — upper center ─── -->
  <!-- Outer glow halo -->
  <ellipse cx="765" cy="198" rx="90" ry="90" fill="url(#orb-glow)" filter="url(#blur-orb)" opacity="0.90"/>
  <ellipse cx="765" cy="198" rx="55" ry="55" fill="url(#orb-glow)" filter="url(#blur-sm)" opacity="0.70"/>
  <!-- Orb body -->
  <circle cx="765" cy="198" r="32" fill="url(#orb-inner)" opacity="0.95"/>
  <!-- Orb shine -->
  <ellipse cx="756" cy="186" rx="10" ry="8" fill="white" opacity="0.50"/>
  <!-- Orbital rings -->
  <ellipse cx="765" cy="198" rx="52" ry="18" fill="none" stroke="#00CFFF" stroke-width="1.5" opacity="0.60" transform="rotate(-25,765,198)"/>
  <ellipse cx="765" cy="198" rx="52" ry="18" fill="none" stroke="#6B4EFF" stroke-width="1.0" opacity="0.40" transform="rotate(-25,765,198)" filter="url(#blur-xs)"/>
  <ellipse cx="765" cy="198" rx="44" ry="20" fill="none" stroke="#AA367C" stroke-width="1.2" opacity="0.45" transform="rotate(55,765,198)"/>
  <ellipse cx="765" cy="198" rx="60" ry="14" fill="none" stroke="#4A2FBD" stroke-width="0.8" opacity="0.35" transform="rotate(10,765,198)"/>

  <!-- ─── Particles / Stars ─── -->
  <!-- Purple particles -->
  <circle cx="48" cy="308" r="2.5" fill="#AA367C" opacity="0.35"/>
  <circle cx="295" cy="168" r="2.0" fill="#AA367C" opacity="0.30"/>
  <circle cx="420" cy="230" r="1.5" fill="#7B3FBE" opacity="0.38"/>
  <circle cx="610" cy="232" r="2.0" fill="#AA367C" opacity="0.28"/>
  <circle cx="910" cy="178" r="1.8" fill="#AA367C" opacity="0.32"/>
  <circle cx="1065" cy="266" r="2.2" fill="#7B3FBE" opacity="0.30"/>
  <circle cx="1290" cy="285" r="2.0" fill="#AA367C" opacity="0.28"/>
  <circle cx="1415" cy="570" r="2.5" fill="#AA367C" opacity="0.32"/>
  <circle cx="1450" cy="412" r="1.5" fill="#AA367C" opacity="0.28"/>

  <!-- Blue particles -->
  <circle cx="383" cy="372" r="2.0" fill="#4A2FBD" opacity="0.28"/>
  <circle cx="718" cy="462" r="2.2" fill="#4A2FBD" opacity="0.30"/>
  <circle cx="800" cy="570" r="1.8" fill="#6B4EFF" opacity="0.28"/>
  <circle cx="1025" cy="458" r="2.0" fill="#4A2FBD" opacity="0.30"/>
  <circle cx="1210" cy="444" r="1.5" fill="#4A2FBD" opacity="0.26"/>
  <circle cx="1310" cy="580" r="2.0" fill="#4A2FBD" opacity="0.28"/>
  <circle cx="1440" cy="180" r="2.5" fill="#4A2FBD" opacity="0.32"/>
  <circle cx="1880" cy="412" r="2.0" fill="#6B4EFF" opacity="0.28"/>
  <circle cx="1880" cy="575" r="2.5" fill="#4A2FBD" opacity="0.30"/>

  <!-- Tiny scattered dots — purple -->
  <circle cx="165" cy="214" r="1.2" fill="#AA367C" opacity="0.25"/>
  <circle cx="475" cy="462" r="1.0" fill="#7B3FBE" opacity="0.22"/>
  <circle cx="562" cy="612" r="1.2" fill="#AA367C" opacity="0.25"/>
  <circle cx="680" cy="688" r="1.0" fill="#AA367C" opacity="0.20"/>
  <circle cx="860" cy="740" r="1.2" fill="#7B3FBE" opacity="0.22"/>
  <circle cx="1150" cy="692" r="1.0" fill="#AA367C" opacity="0.20"/>
  <circle cx="1210" cy="770" r="1.2" fill="#AA367C" opacity="0.22"/>

  <!-- Tiny scattered dots — blue -->
  <circle cx="295" cy="462" r="1.0" fill="#4A2FBD" opacity="0.22"/>
  <circle cx="945" cy="332" r="1.2" fill="#6B4EFF" opacity="0.24"/>
  <circle cx="1095" cy="576" r="1.0" fill="#4A2FBD" opacity="0.20"/>
  <circle cx="1390" cy="730" r="1.2" fill="#6B4EFF" opacity="0.22"/>
  <circle cx="1700" cy="310" r="1.0" fill="#4A2FBD" opacity="0.20"/>
  <circle cx="1750" cy="724" r="1.2" fill="#4A2FBD" opacity="0.22"/>
  <circle cx="1820" cy="188" r="1.0" fill="#6B4EFF" opacity="0.20"/>
</svg>